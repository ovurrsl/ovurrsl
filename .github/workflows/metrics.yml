name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN must be a personal access token (classic) with the
          # `public_repo` and `read:user` scopes. The default GITHUB_TOKEN can't
          # read user-level data, so the notable plugin fails with
          # "Unexpected error" when it is used instead.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ovurrsl
          template: classic
          base: header, activity
          config_timezone: Europe/Istanbul
          config_display: large
          config_order: base.header, calendar, notable, base.activity

          # Flat commit calendar, current year only
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Organisations and repositories contributed to
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request

          # GitHub dark theme colours so the card blends into the profile page
          extras_css: |
            svg { color: #c9d1d9 !important; }
            h1, h2, h3 { color: #58a6ff !important; }
            .field, .row, .activity { color: #8b949e !important; }
            .calendar .day { outline: 1px solid rgba(255,255,255,0.05) !important; }
            .calendar .day[fill="#ebedf0"] { fill: #161b22 !important; }
            .calendar .day[fill="#9be9a8"] { fill: #0e4429 !important; }
            .calendar .day[fill="#40c463"] { fill: #006d32 !important; }
            .calendar .day[fill="#30a14e"] { fill: #26a641 !important; }
            .calendar .day[fill="#216e39"] { fill: #39d353 !important; }
            .contribution.organization { background-color: #161b22 !important; border-color: #30363d !important; color: #c9d1d9 !important; }
            .footer, footer { color: #484f58 !important; }
