        <path d="M-14,-41 l14,-7 l14,7 l-14,7 z" fill="#39d353" />
        <path d="M-14,-41 l0,48 l14,7 l0,-48 z" fill="#2ea043" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-48 l14,-7 l0,48 z" fill="#238636" filter="url(#iso-l2)" />
