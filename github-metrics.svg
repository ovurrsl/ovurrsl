          <text x="0" y="44" class="text-muted">Primary Focus</text>
          <text x="140" y="44" class="text-regular" font-weight="600">Full-Stack, 3D &amp; Performance</text>

          <text x="0" y="76" class="text-muted">Peak Velocity</text>
          <text x="140" y="76" class="text-regular" font-weight="600">Sunday (60 Commits)</text>

          <text x="0" y="108" class="text-muted">Current Streak</text>
          <text x="140" y="108" class="text-mono" font-size="14" font-weight="700">Consistent Active Flow</text>

          <text x="0" y="138" class="text-muted">Methodology</text>
          <text x="140" y="138" class="badge-text" font-size="12">AI Pair Programming (Claude)</text>
