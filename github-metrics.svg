<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 16; }
      .header-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f0f6fc; }
      .header-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; fill: #8b949e; }
      .section-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #58a6ff; letter-spacing: 0.3px; }
      .text-regular { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; fill: #c9d1d9; }
      .text-muted { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #8b949e; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #7ee787; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 10; }
      .badge-bg { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6; }
      .badge-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #58a6ff; }
      .stat-num { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f0f6fc; }
      .stat-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
      .divider { stroke: #21262d; stroke-width: 1; }
    </style>

    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#0969da" />
    </linearGradient>

    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>

    <!-- Isometric Cube Top/Left/Right Filters -->
    <filter id="iso-l1">
      <feComponentTransfer><feFuncR type="linear" slope="0.85"/><feFuncG type="linear" slope="0.85"/><feFuncB type="linear" slope="0.85"/></feComponentTransfer>
    </filter>
    <filter id="iso-l2">
      <feComponentTransfer><feFuncR type="linear" slope="0.5"/><feFuncG type="linear" slope="0.5"/><feFuncB type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="1136" class="bg" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <!-- Avatar circle -->
    <rect x="0" y="0" width="56" height="56" rx="28" fill="#1f6feb" />
    <text x="28" y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#ffffff">RÖ</text>

    <!-- Identity & Info -->
    <text x="70" y="24" class="header-title">Resul Övür</text>
    <text x="180" y="24" class="text-muted" font-size="14">(@ovurrsl)</text>
    <text x="70" y="46" class="header-sub">Web Design &amp; Coding • Three.js 3D &amp; Modern UI • AI-Assisted Pair Programming</text>

    <!-- Top Stats Row -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="186" height="60" class="card" />
      <text x="16" y="28" class="stat-num">498</text>
      <text x="16" y="46" class="stat-label">Contributions (2026)</text>

      <rect x="200" y="0" width="186" height="60" class="card" />
      <text x="216" y="28" class="stat-num">13 PRs</text>
      <text x="216" y="46" class="stat-label">pascalorg / 3D CAD</text>

      <rect x="400" y="0" width="186" height="60" class="card" />
      <text x="416" y="28" class="stat-num">98.2%</text>
      <text x="416" y="46" class="stat-label">TypeScript Stack</text>

      <rect x="600" y="0" width="186" height="60" class="card" />
      <text x="616" y="28" class="stat-num">Rank A</text>
      <text x="616" y="46" class="stat-label">Commits &amp; PR Trophies</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="32" y1="184" x2="818" y2="184" class="divider" />

  <!-- ==================== COMPONENT 1: 3D ISOMETRIC CALENDAR ==================== -->
  <g transform="translate(32, 204)">
    <g>
      <!-- Title -->
      <path d="M0,2 h14 v12 h-14 z M3,0 v4 M11,0 v4" fill="none" stroke="#58a6ff" stroke-width="1.6" />
      <text x="22" y="12" class="section-title">ISOMETRIC 3D CONTRIBUTION CALENDAR</text>
      <text x="670" y="12" class="text-mono">4-DAY STREAK • PEAK 40</text>
    </g>

    <rect x="0" y="26" width="786" height="210" class="card" />

    <!-- 3D Isometric Projection Grid -->
    <g transform="translate(390, 85)">
      <!-- Ground Iso Plane Reference -->
      <!-- We render representative columns of 3D cubes with heights corresponding to commit activity -->
      
      <!-- Week 1 - 24 base grid -->
      <!-- Isometric cube generator macro: Top: (0,0) (14, 7) (0, 14) (-14, 7); Left side; Right side -->
      
      <!-- Inactive background cells -->
      <g opacity="0.35">
        <path d="M-280,40 l12,6 l-12,6 l-12,-6 z" fill="#21262d" stroke="#30363d" stroke-width="0.5" />
        <path d="M-250,25 l12,6 l-12,6 l-12,-6 z" fill="#21262d" stroke="#30363d" stroke-width="0.5" />
        <path d="M-220,10 l12,6 l-12,6 l-12,-6 z" fill="#21262d" stroke="#30363d" stroke-width="0.5" />
        <path d="M-190,-5 l12,6 l-12,6 l-12,-6 z" fill="#21262d" stroke="#30363d" stroke-width="0.5" />
        <path d="M-160,-20 l12,6 l-12,6 l-12,-6 z" fill="#21262d" stroke="#30363d" stroke-width="0.5" />
        <path d="M-130,-35 l12,6 l-12,6 l-12,-6 z" fill="#21262d" stroke="#30363d" stroke-width="0.5" />
      </g>

      <!-- Active 3D Columns (Tower Bars) for recent active periods -->
      <!-- Bar 1 (Height 20) -->
      <g transform="translate(-100, 20)">
        <path d="M-14,-13 l14,-7 l14,7 l-14,7 z" fill="#39d353" />
        <path d="M-14,-13 l0,20 l14,7 l0,-20 z" fill="#2ea043" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-20 l14,-7 l0,20 z" fill="#238636" filter="url(#iso-l2)" />
      </g>

      <!-- Bar 2 (Height 42 - Peak) -->
      <g transform="translate(-70, 5)">
        <path d="M-14,-35 l14,-7 l14,7 l-14,7 z" fill="#39d353" />
        <path d="M-14,-35 l0,42 l14,7 l0,-42 z" fill="#2ea043" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-42 l14,-7 l0,42 z" fill="#238636" filter="url(#iso-l2)" />
      </g>

      <!-- Bar 3 (Height 28) -->
      <g transform="translate(-40, -10)">
        <path d="M-14,-21 l14,-7 l14,7 l-14,7 z" fill="#39d353" />
        <path d="M-14,-21 l0,28 l14,7 l0,-28 z" fill="#2ea043" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-28 l14,-7 l0,28 z" fill="#238636" filter="url(#iso-l2)" />
      </g>

      <!-- Bar 4 (Height 16) -->
      <g transform="translate(-10, -25)">
        <path d="M-14,-9 l14,-7 l14,7 l-14,7 z" fill="#2ea043" />
        <path d="M-14,-9 l0,16 l14,7 l0,-16 z" fill="#238636" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-16 l14,-7 l0,16 z" fill="#196c2e" filter="url(#iso-l2)" />
      </g>

      <!-- Bar 5 (Height 34) -->
      <g transform="translate(20, -10)">
        <path d="M-14,-27 l14,-7 l14,7 l-14,7 z" fill="#39d353" />
        <path d="M-14,-27 l0,34 l14,7 l0,-34 z" fill="#2ea043" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-34 l14,-7 l0,34 z" fill="#238636" filter="url(#iso-l2)" />
      </g>

      <!-- Bar 6 (Height 48 - Super Peak) -->
