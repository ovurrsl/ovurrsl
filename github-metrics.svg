        <path d="M-14,-23 l0,30 l14,7 l0,-30 z" fill="#2ea043" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-30 l14,-7 l0,30 z" fill="#238636" filter="url(#iso-l2)" />
