          <!-- TS -->
          <circle cx="6" cy="6" r="6" fill="#3178c6" />
          <text x="22" y="10" class="text-regular" font-weight="600">TypeScript</text>
          <text x="320" y="10" text-anchor="end" class="text-mono">98.2%</text>

          <!-- C++ -->
          <circle cx="6" cy="34" r="6" fill="#f34b7d" />
          <text x="22" y="38" class="text-regular" font-weight="600">C++</text>
          <text x="320" y="38" text-anchor="end" class="text-mono">1.0%</text>

          <!-- JS -->
