        <path d="M-14,-29 l14,-7 l14,7 l-14,7 z" fill="#39d353" />
        <path d="M-14,-29 l0,36 l14,7 l0,-36 z" fill="#2ea043" filter="url(#iso-l1)" />
        <path d="M0,14 l0,-36 l14,-7 l0,36 z" fill="#238636" filter="url(#iso-l2)" />
      </g>
    </g>

    <!-- Legend inside calendar -->
