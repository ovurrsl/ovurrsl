      <rect x="14" y="16" width="34" height="34" rx="8" fill="url(#grad-purple)" />
      <text x="31" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">E</text>

      <text x="58" y="30" class="text-regular" font-weight="600" font-size="14">exo-explore/exo</text>
      <rect x="190" y="16" width="55" height="20" class="badge-bg" />
      <text x="217" y="30" text-anchor="middle" class="badge-text">6 PRs</text>

      <text x="58" y="52" class="text-muted">Run frontier AI cluster locally</text>
      <text x="14" y="80" class="text-mono" font-size="11">• Windows Native NVIDIA GPU Run</text>
      <text x="14" y="98" class="text-mono" font-size="11">• CI Matrix &amp; Environment Parity</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="32" y1="640" x2="818" y2="640" class="divider" />

